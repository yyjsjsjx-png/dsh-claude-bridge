# Template only: replace the file URL placeholders in an isolated desktop
# profile. Do not copy this file into the user's existing profile.
- id: agent-loop
  disabled: true
- insert:
    - id: claude-agent-loop
      name: '__AGENT_LOOP_URL__'
      config:
        sourceEntry: agent-loop
    - id: claude-bridge
      name: '__BRIDGE_SERVICE_URL__'
      config:
        transport: wss
    - id: claude-session-controller
      name: '__SESSION_CONTROLLER_URL__'
    - id: preset-claude-sdk-remote
      name: '__PRESET_SERVICE_URL__'
    - id: claude-bridge-ui
      name: '__BRIDGE_UI_URL__'
