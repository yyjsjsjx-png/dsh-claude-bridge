# DSH bundle with runtime capability checks. Enable in a dedicated profile.
- id: agent-loop
  disabled: true
- insert:
    - id: claude-agent-loop
      name: dsh-claude-bridge/agent-loop
      config:
        sourceEntry: agent-loop
    - id: claude-bridge
      name: dsh-claude-bridge/bridge
      config:
        transport: wss
    - id: claude-session-controller
      name: dsh-claude-bridge/session-policy
    - id: preset-claude-sdk-remote
      name: dsh-claude-bridge/preset
    - id: claude-bridge-ui
      name: dsh-claude-bridge
