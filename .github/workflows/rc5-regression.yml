name: rc.5 regression

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rc5-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  node:
    name: Node 24 / no key
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24.22.2'
          package-manager-cache: false
      - name: Check the committed client bundle
        run: node scripts/build-client.mjs --check
      - name: Run existing npm test suite
        run: node scripts/run-regression.mjs --layer node --output regression-results/node
      - name: Upload Node report and explicit skip counts
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: rc5-node-results
          path: regression-results
          if-no-files-found: warn
          retention-days: 14

  rc5-native:
    name: Windows / real rc.5 Electron ASAR
    runs-on: windows-2025
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24.22.2'
          package-manager-cache: false
      - name: Extract the fixed official desktop using existing 7zip
        run: node scripts/prepare-ci-dsh.mjs --report regression-results/ci-target.json
      - name: Run native tests with zero skips
        run: node scripts/run-regression.mjs --layer native --output regression-results/native
      - name: Upload native preflight and test report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: rc5-native-results
          path: regression-results
          if-no-files-found: warn
          retention-days: 14
